    namespace: ctfd
spec:
    name: Temporal API
    description: |
        Le Temporal Research Institute dispose d'une API REST interne pour gérer ses missions de voyage temporel.
        Un compte 'invité' est disponible (guest/guest).
        Mais les informations les plus sensibles sont réservées aux administrateurs de Temporal Command.
        L'Omega Protocol, classifié au plus haut niveau, contiendrait des coordonnées temporelles d'une importance capitale...
        L'API semble utiliser des JWT pour l'authentification. Peut-être que leur implémentation cache des faiblesses ?
